# Host nginx vhost for ctc.runvaders.com (step 2, after the cert exists).
#   cp deploy/nginx-ctc.runvaders.com.conf /etc/nginx/sites-available/ctc.runvaders.com
#   nginx -t && systemctl reload nginx
#
# Pages go to the app (127.0.0.1:8084). The Supabase APIs the browser calls
# directly go to Kong (127.0.0.1:8085). Same origin for both, so no CORS
# preflights and one certificate.

server {
    listen 80;
    server_name ctc.runvaders.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ctc.runvaders.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ctc.runvaders.com;

    ssl_certificate     /etc/letsencrypt/live/ctc.runvaders.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctc.runvaders.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Supabase: auth, PostgREST, Realtime via Kong.
    # Only the versioned Supabase prefixes: the app has its own /auth/callback
    # route, which a plain ^/auth/ match would send to Kong (404 "no Route matched").
    location ~ ^/(auth|rest|realtime)/v1/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime is a WebSocket at /realtime/v1/websocket. Without these the
        # leaderboard loads but never updates live, and nothing logs an error.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Everything else: the Next.js app.
    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The magic-link callback builds its redirect from these (app/auth/callback/route.ts).
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
