# Mirrors deploy/nginx-ctc-scoring.runvaders.com.conf's routing over plain HTTP, with
# compose service names in place of the Droplet's loopback ports.
server {
    listen 80;
    server_name ctc.localhost;

    # Only the versioned Supabase prefixes: the app has its own /auth/callback
    # route, which a plain ^/auth/ match would send to Kong (404 "no Route matched").
    location ~ ^/(auth|rest|realtime)/v1/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
