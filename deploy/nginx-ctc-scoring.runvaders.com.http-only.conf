# Step 1 of TLS setup: HTTP-only vhost so certbot can answer the ACME challenge.
# Install as root, then request the cert (docs/DEPLOYMENT.md "nginx and TLS"):
#   cp deploy/nginx-ctc-scoring.runvaders.com.http-only.conf /etc/nginx/sites-available/ctc-scoring.runvaders.com
#   ln -sf /etc/nginx/sites-available/ctc-scoring.runvaders.com /etc/nginx/sites-enabled/
#   mkdir -p /var/www/certbot && nginx -t && systemctl reload nginx
#   certbot certonly --webroot -w /var/www/certbot -d ctc-scoring.runvaders.com
# Then replace this file with nginx-ctc-scoring.runvaders.com.conf.
server {
    listen 80;
    server_name ctc-scoring.runvaders.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
