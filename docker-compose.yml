# Production stack for ctc-scoring on the shared Droplet (/opt/ctc-scoring).
# The app plus auth, rest, realtime, kong -- pointed at the *shared* Postgres
# instance already running as food-shopper's `db` (supabase-db), in its own
# `ctc_scoring` database. There is no local `db` service here: this stack
# reuses the shared cluster instead of running a second Postgres.
# See docs/ARCHITECTURE.md for the picture and docs/DEPLOYMENT.md for setup.
#
# Only `app` and `kong` publish ports, and only on 127.0.0.1. Host nginx
# (outside this file) terminates TLS for ctc-scoring.runvaders.com and
# proxies to them.
#
# No `container_name` anywhere: names are global on a Docker host, and
# food-shopper's stack already uses supabase-db, supabase-auth, and so on.
# Compose's project-prefixed names (ctc-scoring-app-1, ...) keep them apart.
#
# `app`, `auth`, `rest`, and `realtime` all need to reach the shared Postgres
# (`db`/`supabase-db`), which lives on food-shopper's compose network and
# publishes no host port. So they're attached to that network too, via the
# external `supabase_net` alias below -- in addition to this project's own
# default network, which `kong` uses to reach `auth`/`rest`/`realtime` by name.

services:
  app:
    image: ${DOCKERHUB_USERNAME:-local}/ctc-scoring:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-only; the health check reaches Kong directly on the compose network.
      SUPABASE_INTERNAL_URL: http://kong:8000
      # Server-only, for the temporary open login (app/login/actions.ts).
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Unset: open login (any email, no email sent). magic-link: email sign-in.
      LOGIN_MODE: ${LOGIN_MODE:-}
      # Read by deploy/migrate.sh from the entrypoint. POSTGRES_DB is this
      # app's own database inside the shared Postgres instance.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${HOST_APP_PORT:-8084}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default
      - supabase_net
    depends_on:
      # GoTrue owns the auth schema that the app's migrations use (auth.jwt()).
      # No local `db` to depend on: the shared Postgres instance is already
      # running and outside this compose project's lifecycle.
      auth:
        condition: service_healthy
      kong:
        condition: service_started

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    networks:
      - default
      - supabase_net
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    networks:
      - default
      - supabase_net
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: "postgrest"

  realtime:
    image: supabase/realtime:v2.134.10
    restart: unless-stopped
    # Realtime takes its tenant id from the first label of the hostname it's
    # reached at ("realtime-dev", the tenant SEED_SELF_HOST creates). Kong
    # routes to this alias; see deploy/volumes/api/kong.yml. The alias only
    # needs to exist on `default`, since that's the network kong is on.
    networks:
      default:
        aliases:
          - realtime-dev.ctc-realtime
      supabase_net: {}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "-H",
          "Authorization: Bearer ${ANON_KEY}",
          "http://localhost:4000/api/tenants/realtime-dev/health",
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET} # required by this Realtime version; it won't boot without it
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'
    ports:
      - "127.0.0.1:${HOST_KONG_PORT:-8085}:8000"
    depends_on:
      - auth
      - rest
      - realtime
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./deploy/volumes/api/kong.yml:/home/kong/temp.yml:ro

  # One-shot, never started by `up`: `docker compose run --rm migrate` for manual
  # use where `run` is allowed. Production migrates from the app's entrypoint.
  # Points at the same shared Postgres instance as the other services.
  migrate:
    image: postgres:17
    profiles: ["tools"]
    networks:
      - supabase_net
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./deploy/migrate.sh:/migrate.sh:ro
    entrypoint: ["bash", "/migrate.sh"]

networks:
  default: {}
  # food-shopper's compose network. supabase-db (aliased "db") lives here and
  # publishes no host port, so this is the only way to reach it.
  supabase_net:
    name: food-shopper_default
    external: true
