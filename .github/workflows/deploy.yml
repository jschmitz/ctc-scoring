name: deploy

# verify runs on every push and PR. ship runs only on main, only after verify
# passes: it builds the image, pushes it to Docker Hub, and SSHes to the
# Droplet to run /opt/ctc-scoring/deploy.sh <sha>. See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ctc.runvaders.com
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-check-placeholder

  ship:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Droplets are amd64. An image built for arm64 (the default on Apple
      # Silicon) pulls fine and then fails with "exec format error".
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ctc-scoring:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ctc-scoring:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on the Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ctc-scoring
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: /opt/ctc-scoring/deploy.sh ${{ github.sha }}

      - name: Health check
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS https://ctc.runvaders.com/api/health; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::https://ctc.runvaders.com/api/health did not return 200 within 2 minutes"
          exit 1
